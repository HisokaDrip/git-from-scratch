[project]
name = "tinygit"
version = "0.1.0"
description = "git internals from scratch: loose objects, packfiles, the index, myers diff"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
tinygit = "tinygit.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tinygit"]
